searchHelp=Ajuda de Pesquisa
search.help.text=Fun\u00e7\u00f5es at\u00f4micas verificam se uma receita satisfaz uma certa condi\u00e7\u00e3o, como a quantidade m\u00e1xima de passos ou um ingrediente que deve estar presente. A fun\u00e7\u00e3o HAS verifica se a receita cont\u00e9m o texto fornecido em qualquer um de seus ingredientes, passos ou nome.\n\nFun\u00e7\u00f5es combinadas permitem combinar condi\u00e7\u00f5es. Por exemplo, a fun\u00e7\u00e3o HAS \u00e9 equivalente a AND(HASING, HASSTEP, HASNAME). Fun\u00e7\u00f5es combinadas podem ser aninhadas.

