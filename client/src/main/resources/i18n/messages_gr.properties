search.help.text=\u039F\u03B9 \u03B1\u03C4\u03BF\u03BC\u03B9\u03BA\u03AD\u03C2 \u03C3\u03C5\u03BD\u03B1\u03C1\u03C4\u03AE\u03C3\u03B5\u03B9\u03C2 \u03B5\u03BB\u03AD\u03B3\u03C7\u03BF\u03C5\u03BD \u03B1\u03BD \u03BC\u03B9\u03B1 \u03C3\u03C5\u03BD\u03C4\u03B1\u03B3\u03AE \u03B9\u03BA\u03B1\u03BD\u03BF\u03C0\u03BF\u03B9\u03B5\u03AF \u03BC\u03B9\u03B1 \u03C3\u03C5\u03B3\u03BA\u03B5\u03BA\u03C1\u03B9\u03BC\u03AD\u03BD\u03B7 \u03C0\u03C1\u03BF\u03CB\u03C0\u03CC\u03B8\u03B5\u03C3\u03B7, \u03CC\u03C0\u03C9\u03C2 \u03C4\u03BF\u03BD \u03BC\u03AD\u03B3\u03B9\u03C3\u03C4\u03BF \u03B1\u03C1\u03B9\u03B8\u03BC\u03CC \u03B2\u03B7\u03BC\u03AC\u03C4\u03C9\u03BD \u03AE \u03AD\u03BD\u03B1 \u03C3\u03C5\u03C3\u03C4\u03B1\u03C4\u03B9\u03BA\u03CC \u03C0\u03BF\u03C5 \u03C0\u03C1\u03AD\u03C0\u03B5\u03B9 \u03BD\u03B1 \u03C5\u03C0\u03AC\u03C1\u03C7\u03B5\u03B9. \u0397 \u03C3\u03C5\u03BD\u03AC\u03C1\u03C4\u03B7\u03C3\u03B7 HAS \u03B5\u03BB\u03AD\u03B3\u03C7\u03B5\u03B9 \u03B1\u03BD \u03B7 \u03C3\u03C5\u03BD\u03C4\u03B1\u03B3\u03AE \u03C0\u03B5\u03C1\u03B9\u03AD\u03C7\u03B5\u03B9 \u03C4\u03BF \u03B4\u03BF\u03B8\u03AD\u03BD \u03BA\u03B5\u03AF\u03BC\u03B5\u03BD\u03BF \u03C3\u03B5 \u03BF\u03C0\u03BF\u03B9\u03BF\u03B4\u03AE\u03C0\u03BF\u03C4\u03B5 \u03B1\u03C0\u03CC \u03C4\u03B1 \u03C3\u03C5\u03C3\u03C4\u03B1\u03C4\u03B9\u03BA\u03AC, \u03C4\u03B1 \u03B2\u03AE\u03BC\u03B1\u03C4\u03B1 \u03AE \u03C4\u03BF \u03CC\u03BD\u03BF\u03BC\u03AC \u03C4\u03B7\u03C2.\n\n\u039F\u03B9 \u03C3\u03C5\u03BD\u03B4\u03C5\u03B1\u03C3\u03C4\u03B9\u03BA\u03AD\u03C2 \u03C3\u03C5\u03BD\u03B1\u03C1\u03C4\u03AE\u03C3\u03B5\u03B9\u03C2 \u03C3\u03B1\u03C2 \u03B5\u03C0\u03B9\u03C4\u03C1\u03AD\u03C0\u03BF\u03C5\u03BD \u03BD\u03B1 \u03C3\u03C5\u03BD\u03B4\u03C5\u03AC\u03C3\u03B5\u03C4\u03B5 \u03C0\u03C1\u03BF\u03CB\u03C0\u03BF\u03B8\u03AD\u03C3\u03B5\u03B9\u03C2. \u0393\u03B9\u03B1 \u03C0\u03B1\u03C1\u03AC\u03B4\u03B5\u03B9\u03B3\u03BC\u03B1, \u03B7 \u03C3\u03C5\u03BD\u03AC\u03C1\u03C4\u03B7\u03C3\u03B7 HAS \u03B5\u03AF\u03BD\u03B1\u03B9 \u03B9\u03C3\u03BF\u03B4\u03CD\u03BD\u03B1\u03BC\u03B7 \u03BC\u03B5 \u03C4\u03B7\u03BD AND(HASING, HASSTEP, HASNAME). \u039F\u03B9 \u03C3\u03C5\u03BD\u03B4\u03C5\u03B1\u03C3\u03C4\u03B9\u03BA\u03AD\u03C2 \u03C3\u03C5\u03BD\u03B1\u03C1\u03C4\u03AE\u03C3\u03B5\u03B9\u03C2 \u03BC\u03C0\u03BF\u03C1\u03BF\u03CD\u03BD \u03BD\u03B1 \u03B5\u03AF\u03BD\u03B1\u03B9 \u03B5\u03BC\u03C6\u03C9\u03BB\u03B5\u03C5\u03BC\u03AD\u03BD\u03B5\u03C2.

