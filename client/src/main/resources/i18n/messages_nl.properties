search.help.text=Atomaire functies controleren of een recept aan een bepaalde voorwaarde voldoet, zoals het maximale aantal stappen of een ingredi\u00EBnt dat aanwezig moet zijn. De HAS-functie controleert of het recept de opgegeven tekenreeks bevat in een van de ingredi\u00EBnten, stappen of in de naam.\n\nGecombineerde functies laten je voorwaarden combineren. De HAS-functie is bijvoorbeeld gelijk aan AND(HASING, HASSTEP, HASNAME). Gecombineerde functies kunnen worden genest.

