searchHelp=Zoekhulp
search.help.text=Atomaire functies controleren of een recept aan een bepaalde voorwaarde voldoet, zoals het maximale aantal stappen of een ingrediënt dat aanwezig moet zijn. De HAS-functie controleert of het recept de gegeven string bevat in een van zijn ingrediënten, stappen of zijn naam.\n\nGecombineerde functies laten je voorwaarden combineren. Bijvoorbeeld, de HAS-functie is gelijk aan AND(HASING, HASSTEP, HASNAME). Gecombineerde functies kunnen genest worden.\n\nDe HASLANG-functie accepteert in het bijzonder alleen de volgende argumenten voor filtering: en (Engels), nl (Nederlands), sk (Slowaaks), gr (Helleens), pt (Portugees).

