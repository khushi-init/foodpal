searchHelp=Pomoc s vyh\u013Ead\u00E1van\u00EDm
search.help.text=At\u00F3mov\u00E9 funkcie kontroluj\u00FA, \u010Di recept sp\u013A\u0148a ur\u010Dit\u00FA podmienku, ako napr\u00EDklad maxim\u00E1lny po\u010Det krokov alebo pr\u00EDsadu, ktor\u00E1 mus\u00ED by\u0165 pr\u00EDtomn\u00E1. Funkcia HAS kontroluje, \u010Di recept obsahuje zadan\u00FD re\u0165azec v ktorejko\u013Evek z jeho pr\u00EDsad, krokov alebo v n\u00E1zve. \n Kombinovan\u00E9 funkcie v\u00E1m umo\u017E\u0148uj\u00FA kombinova\u0165 podmienky. Napr\u00EDklad funkcia HAS je ekvivalentn\u00E1 s OR(HASING, HASSTEP, HASNAME). Kombinovan\u00E9 funkcie m\u00F4\u017Eu by\u0165 vnoren\u00E9. Funkcia HASLANG konkr\u00E9tne prij\u00EDma na filtrovanie iba nasleduj\u00FAce argumenty: en (angli\u010Dtina), nl (holand\u010Dina), sk (sloven\u010Dina), gr (gr\u00E9\u010Dtina), pt (portugal\u010Dina).search.title=Gener\u00E1tor pokro\u010Dil\u00FDch otazok
